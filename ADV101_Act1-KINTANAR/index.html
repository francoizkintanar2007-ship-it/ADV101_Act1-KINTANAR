<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Simple List</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    input, button { padding: 8px; }
    ul { margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Simple List</h1>
  <p class="note">Type items separated by commas.</p>
  <input id="itemInput" placeholder="apple, banana">
  <button id="addBtn">Add</button>
  <ul id="itemList"></ul>
  <script src="script.js"></script>
</body>
</html>
